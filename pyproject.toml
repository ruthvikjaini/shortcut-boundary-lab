[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shortcut-boundary-lab"
version = "0.1.0"
description = "Reproduce and extend Shen (arXiv:2611.12865): verifiable RL misalignment from reward-context conflicts, and contextual safety learning -- on a small CPU testbed"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
